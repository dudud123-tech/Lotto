<!--
  매거진 아티클 작성 템플릿 (배포 대상 아님, 참고용)

  새 글을 만들 때:
  1. 이 파일을 public/magazine/{slug}/index.html 로 복사
  2. {{...}} 자리 채우기
  3. public/data/magazine-articles.json 의 "articles" 배열에 항목 추가:
     { "slug": "...", "title": "...", "category": "...", "description": "...", "date": "YYYY-MM-DD" }
  4. 새 카테고리라면 public/assets/css/magazine.css 에 .tag-{{category}} 색상 규칙 추가
  5. 사람 검토 후 확정되면 public/sitemap.xml 에 https://lotto-studio.net/magazine/{slug}/ 추가
     (검토 전에는 <meta name="robots" content="noindex"> 유지)
-->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{제목}} | Lotto Studio 매거진</title>
  <meta name="description" content="{{설명 - 검색결과에 노출될 1~2문장}}">
  <!-- 사람 검토가 끝나고 게시 확정되면 아래 noindex 줄을 지운다 -->
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../../assets/css/legal.css">
  <link rel="stylesheet" href="../../assets/css/magazine.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9448487760420558" crossorigin="anonymous"></script>
</head>
<body>
  <main class="page">
    <header class="top">
      <a class="brand" href="../../index.html"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span>Lotto Studio</span></a>
      <a class="home-link" href="../index.html">매거진 목록으로</a>
    </header>
    <section class="hero">
      <div class="magazine-header">
        <h1>{{제목}}</h1>
        <span class="tag tag-{{카테고리}}">{{카테고리}}</span>
      </div>
      <p class="lead">{{한 줄 요약}}</p>
      <p class="meta-line"><span>{{게시일 YYYY.MM.DD}}</span><span class="dot" aria-hidden="true"></span><span>{{읽는 시간, 예: 4분}}</span></p>
    </section>
    <section class="content article-body">
      <h2>{{소제목 1}}</h2>
      <p>{{본문 문단}}</p>

      <h2>{{소제목 2}}</h2>
      <p>{{본문 문단}}</p>

      <!-- 실제 수치·데이터가 있으면 표/리스트로 근거를 보여줄 것. 뻔한 요약이 아니라 구체적인 내용 위주로 작성 -->
      <ul>
        <li>{{근거 1}}</li>
        <li>{{근거 2}}</li>
      </ul>

      <div class="article-related">
        <h2>함께 보면 좋은 페이지</h2>
        <ul>
          <li><a href="../../index.html">Lotto Studio 홈</a></li>
          <li><a href="../index.html">매거진 목록</a></li>
        </ul>
      </div>
    </section>
    <p class="footer">© Lotto Studio</p>
  </main>
</body>
</html>
